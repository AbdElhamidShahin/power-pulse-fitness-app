name: power_pulse
description: "Power Pulse - Fitness App"
publish_to: "none"

version: 1.0.0+22

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Auth & Backend
  supabase_flutter: ^2.8.4

  # Navigation
  go_router: ^14.6.2

  # State Management
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6

  # DI
  get_it: ^9.2.1

  # Network
  dio: ^5.6.0
  connectivity_plus: ^6.1.1

  # Local Storage
  shared_preferences: ^2.3.2

  # UI / Styling
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  flutter_staggered_animations: ^1.1.1
  cupertino_icons: ^1.0.8
  hexcolor: ^3.0.1
  cached_network_image: ^3.4.1

  # Charts / Gauges
  syncfusion_flutter_gauges: ^31.1.19

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Pedometer
  pedometer: ^4.0.2

  # Misc
  url_launcher: ^6.3.0
  provider: ^6.1.2

  # Launcher Icons
  flutter_launcher_icons: ^0.14.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/langs/en.json
    - assets/langs/ar.json
    - assets/exercises.json
    - assets/animation/
    - assets/images/
    - assets/catogry/
    - assets/GIF/chest/
    - assets/GIF/lats/
    - assets/GIF/shorter/
    - assets/GIF/hands/
    - assets/GIF/legs/
    - assets/GIF/beily/
    - assets/images/123456.jpg