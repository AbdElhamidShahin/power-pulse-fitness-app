name: power_pulse
description: تطبيق اللياقة البدنية المتكامل
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^8.0.2
  go_router: ^14.2.0
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  dartz: ^0.10.1
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  lottie: ^3.1.2
  intl: ^0.20.2
  connectivity_plus: ^6.0.5
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  url_launcher: ^6.3.2
  syncfusion_flutter_gauges: ^31.1.19
  flutter_staggered_animations: ^1.1.1
  flutter_custom_tab_bar: ^1.2.1
  animations: ^2.1.1
  pedometer: ^4.2.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  awesome_snackbar_content: ^0.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900

  assets:
    - assets/images/
    - assets/fonts/