name: power_pulse
description: تطبيق اللياقة البدنية المتكامل
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ─── State Management ───────────────────────────────────────
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # ─── DI ─────────────────────────────────────────────────────
  get_it: ^8.0.2

  # ─── Navigation ─────────────────────────────────────────────
  go_router: ^14.2.0

  # ─── Network ────────────────────────────────────────────────
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # ─── Functional ─────────────────────────────────────────────
  dartz: ^0.10.1

  # ─── Local Storage ──────────────────────────────────────────
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # ─── UI ─────────────────────────────────────────────────────
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  lottie: ^3.1.2

  # ─── Fonts (Cairo عربي) ──────────────────────────────────────
  # ✅ الحل الأسهل: google_fonts تحمّل Cairo تلقائياً من النت
  # أو استخدم الـ assets fonts أدناه (الأفضل للإنتاج)
  google_fonts: ^6.2.1

  # ─── Utils ──────────────────────────────────────────────────
  intl: ^0.20.2
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  # ════════════════════════════════════════════════════════════
  # FONTS — Cairo العربي
  # ════════════════════════════════════════════════════════════
  # خيار 1 (موصى به): ضع ملفات Cairo في assets/fonts/
  # حمّل من: https://fonts.google.com/specimen/Cairo
  # الملفات المطلوبة:
  #   Cairo-Regular.ttf   (400)
  #   Cairo-Medium.ttf    (500)
  #   Cairo-SemiBold.ttf  (600)
  #   Cairo-Bold.ttf      (700)
  #   Cairo-ExtraBold.ttf (800)
  #   Cairo-Black.ttf     (900)
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900

  assets:
    - assets/images/
    - assets/fonts/
    - assets/GIF/
