name: power_pulse
description: تطبيق اللياقة البدنية المتكامل
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ─── State Management ───────────────────────────────────────
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # ─── DI ─────────────────────────────────────────────────────
  get_it: ^8.0.2

  # ─── Navigation ─────────────────────────────────────────────
  go_router: ^14.2.0

  # ─── Network ────────────────────────────────────────────────
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # ─── Functional ─────────────────────────────────────────────
  dartz: ^0.10.1

  # ─── Local Storage ──────────────────────────────────────────
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # ─── UI ─────────────────────────────────────────────────────
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  lottie: ^3.1.2

  # ─── Utils ──────────────────────────────────────────────────
  intl: ^0.19.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
